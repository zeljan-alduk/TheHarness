name: release
# Publishes the binary that docs/install.sh downloads. Tag a commit (`git tag v1.0.105 && git push --tags`)
# or run this workflow by hand; the tag name becomes the release name.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create the release as (e.g. v1.0.105)'
        required: true

permissions:
  contents: write

jobs:
  macos-arm64:
    runs-on: macos-latest          # Apple Silicon; the only target we ship (see ci.yml)
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: HARNESS_NO_BUMP=1 cargo build --release --locked -p harness --target aarch64-apple-darwin
      - name: Smoke-test the binary
        run: ./target/aarch64-apple-darwin/release/harness --version
      - name: Package
        id: pkg
        run: |
          NAME=harness-aarch64-apple-darwin.tar.gz
          tar -czf "$NAME" -C target/aarch64-apple-darwin/release harness
          shasum -a 256 "$NAME" > "$NAME.sha256"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$(./target/aarch64-apple-darwin/release/harness --version)" >> "$GITHUB_OUTPUT"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "$TAG" \
            --notes "${{ steps.pkg.outputs.version }} — install with:
          \`\`\`sh
          curl -fsSL https://zeljan-alduk.github.io/TheHarness/install.sh | sh
          \`\`\`"
          gh release upload "$TAG" "${{ steps.pkg.outputs.name }}" "${{ steps.pkg.outputs.name }}.sha256" --clobber
