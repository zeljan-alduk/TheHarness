name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-test:
    # macOS on Apple Silicon is the only supported target (MLX). The tree still carries the
    # Linux/Windows code paths; when they are supported again, add them back to a matrix here.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: HARNESS_NO_BUMP=1 cargo build --release -p harness
      - name: Unit tests
        run: cargo test -p harness
      - name: Tool smoke tests (no model)
        run: |
          mkdir -p /tmp/w && cd /tmp/w && git init -q
          H=$GITHUB_WORKSPACE/target/release/harness
          $H --config $GITHUB_WORKSPACE/harness.toml tool bash '{"cmd":"echo ok"}' | grep -q ok
          $H --config $GITHUB_WORKSPACE/harness.toml tool write_file '{"path":"a.txt","content":"hello\n"}'
          $H --config $GITHUB_WORKSPACE/harness.toml tool grep '{"pattern":"hello"}' | grep -q a.txt
          $H --config $GITHUB_WORKSPACE/harness.toml tool glob '{"pattern":"*.txt"}' | grep -q a.txt
      - name: Tool integration tests (no model)
        run: HARNESS_BIN=$GITHUB_WORKSPACE/target/release/harness HARNESS_MEMORY_DIR=/tmp/itest-mem sh scripts/integration_tools.sh
      - name: Headless TUI e2e (pty + VT100 emulator)
        run: |
          pip3 install --break-system-packages pyte >/dev/null 2>&1 || pip3 install pyte
          HARNESS_BIN=$GITHUB_WORKSPACE/target/release/harness python3 scripts/e2e_tui.py --no-model
      - name: Installer syntax + dry run
        run: |
          sh -n docs/install.sh
          DRY_RUN=1 NO_KITTY=1 NO_MLX=1 NO_CLAUDE=1 NO_APP=1 sh docs/install.sh
