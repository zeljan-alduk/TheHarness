name = "rs_fix_bug"
tags = ["rust", "edit", "medium"]
prompt = "This Rust crate has a failing test. Run `cargo test`, find the bug in src/lib.rs, fix it (do not modify the tests), and make sure `cargo test` passes."
check = "cargo test -q 2>&1 | tail -3 | grep -q 'test result: ok' && git diff --quiet HEAD -- src/lib.rs; test $? -eq 1 && ! git diff HEAD --stat -- tests | grep -q ."
max_turns = 20
