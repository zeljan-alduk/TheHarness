[package]
name = "harness"
version = "0.1.0"
edition = "2021"
description = "Local-first agentic coding harness with an eval-gated self-improvement loop"

[lib]
name = "harness"
path = "src/lib.rs"

[[bin]]
name = "harness"
path = "src/main.rs"

[workspace]
members = ["ui/src-tauri"]
# eval workdirs may contain their own Cargo projects; they must not be workspace members
exclude = ["target", "evals"]

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
toml = "0.8"
async-trait = "0.1"
base64 = "0.22"
sha2 = "0.10"
serde_yaml = "0.9"
futures-util = "0.3"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
unicode-width = "0.2"
sysinfo = "0.33"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
ratatui-image = "8.0.1"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
