[package]
name = "harness-ui"
version = "0.1.0"
edition = "2021"
description = "Tauri desktop UI for TheHarness"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
harness = { path = "../.." }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
base64 = "0.22"
