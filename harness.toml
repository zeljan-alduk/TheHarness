# Harness configuration. Every key can be overridden with HARNESS_<UPPER_KEY> env vars.

[llm]
# Any OpenAI-compatible server: LM Studio (:1234), llama-server (:8080), Ollama (:11434/v1),
# OpenAI/OpenRouter/Gemini-compat (set api_key), or Anthropic: provider = "anthropic",
# base_url = "https://api.anthropic.com", model = "claude-sonnet-5", api_key from ANTHROPIC_API_KEY.
base_url = "http://localhost:1234/v1"
model = "qwen3.8-27b-mlx"
# provider = "openai"
# Use your Anthropic subscription through the official Claude Code CLI (must be installed & logged in);
# the harness bridges its own tools to it over MCP. In the TUI: /backend claude
# provider = "claude-code"
# model = "claude-fable-5"
# effort = "high"          # low | medium | high | max  (/effort in the TUI)
# Anthropic API with summarized thinking streamed back (Claude Code's headless mode hides thinking):
# provider = "anthropic"   model = "claude-fable-5"   thinking_budget = 8000
temperature = 0.2
# Reasoning models spend a lot of this budget on thinking; keep it generous.
max_tokens = 16384
# Auto-compaction threshold. By default the harness detects the model's loaded context length at
# start (LM Studio / llama.cpp / Ollama) and compacts at compact_at_fraction × that. Set
# context_budget_tokens to pin an explicit value instead.
compact_at_fraction = 0.75
# context_budget_tokens = 60000
# Optional smaller model for reflection/compaction (must be loaded on the same server):
# aux_model = "qwen/qwen3.6-35b-a3b"
# Models to fall back to, in order, when the configured one is unreachable or 5xx:
# fallback = ["qwen/qwen3.6-35b-a3b", "gemma-4-12b-coder"]
# Anthropic prompt caching (cache_control on the system prompt + tool catalogue):
prompt_cache = true
# Tool calling for servers/models without a function-calling API: "auto" (default) | "on" | "off":
# tool_shim = "auto"

[agent]
max_turns = 40
# Per tool call
tool_timeout_secs = 120
# Max characters of a tool result fed back to the model (head+tail kept)
max_tool_output_chars = 16000
# Optional wall-clock cap per task in the interactive UI (0 = unlimited); queued tasks continue afterwards
max_task_secs = 0

[eval]
tasks_dir = "evals/tasks"
# Where eval workdirs are created. Keep this OUTSIDE any Cargo workspace (default: $TMPDIR/harness-eval-runs).
# runs_dir = "/tmp/harness-eval-runs"
task_timeout_secs = 900

[net]
enabled = true
timeout_secs = 30
max_fetch_bytes = 2000000
# download_file: parallel range segments and per-call wall-clock cap (auto-resumes on the next call)
download_segments = 4
download_timeout_secs = 3600

# Per-role models: use a small/fast local model for the auxiliary calls and keep the big one for coding.
# A role may be just a model name, or a table pointing at another server entirely.
# [llm.roles]
# aux = "qwen3.6-8b"              # default for every auxiliary role below
# compaction = "qwen3.6-8b"       # writing the handoff note
# title = "qwen3.6-8b"            # session titles
# classifier = "qwen3.6-8b"       # [permissions.auto] approvals
# goal = "qwen3.6-8b"             # /goal checks
# memory = "qwen3.6-8b"           # reflection into BRAIN.md
# hook = "qwen3.6-8b"             # { prompt = … } hooks
# vision = { model = "qwen2.5-vl-7b", base_url = "http://localhost:1234/v1" }

[net.proxy]
# Route tool and shell traffic through an allow-list proxy: hosts that do not match get a 403 the agent
# can read, and Authorization/Cookie headers (and bodies that look like credentials) never reach a host
# outside `credentials_to`. Loopback bypasses the proxy, so a local model server is unaffected.
enabled = false
# allow = ["github.com", "*.githubusercontent.com", "crates.io", "registry.npmjs.org", "pypi.org"]
# credentials_to = ["api.github.com"]
# verbose = true

[permissions]
# bypass | auto | ask | plan.  auto: reads free, writes inside the workdir free, risky shell commands
# and writes outside the workdir ask for approval. Regardless of mode (except bypass) the harness
# refuses catastrophic shell commands and never reads .env / ssh keys / credentials into the context.
# Rules: "<tool>", "<tool>:<glob on primary arg>", or the Claude-Code form "Tool(<glob>)"; the pattern
# may address one argument — "Agent(subagent_type:review*)", "WebFetch(domain:example.com)".
mode = "auto"
allow = ["bash:git status*", "bash:git diff*", "bash:git log*", "bash:cargo *", "bash:npm test*", "bash:pytest*"]
deny = ["bash:rm -rf /*", "bash:rm -rf ~*", "bash:*mkfs*", "bash:*dd if=*"]
ask = []

[permissions.auto]
# In auto mode, borderline calls are decided by a classifier (the aux model) instead of interrupting
# you; it fails closed — anything it is unsure about still asks. classifier: true | false | unset
# (unset = on when llm.aux_model is configured). The lists are plain English, one instruction each.
# classifier = true
allow = []   # e.g. "formatters, linters and test runners for this project"
ask = []     # e.g. "anything that pushes to a remote or opens a PR"
deny = []    # e.g. "uploading files anywhere"

[format]
# Format files after the agent edits them (like an editor's format-on-save) and report fresh
# diagnostics from a language server that is already running for this project.
enabled = true
diagnostics_after_edit = true
# Per-extension overrides; "" disables that extension. {file} is the edited file.
# [format.commands]
# rs = "rustfmt --edition 2021 {file}"
# py = ""

# Optional statusline: a command whose first stdout line is shown on the right of the mode line.
# It gets a JSON snapshot on stdin (model, workdir, session_id, tokens, cost_usd, permission_mode…).
# [ui]
# statusline = "jq -r '\"\\(.model) · \\(.tokens.context) ctx\"'"

# Prices for /cost and --max-budget-usd (USD per 1M tokens); built-ins cover the common hosted models.
# [llm.pricing]
# "my-hosted-model*" = { input = 1.0, output = 3.0 }

[telemetry]
# OpenTelemetry export (OTLP/HTTP + JSON). Empty endpoint = off. Events become log records with GenAI
# semconv attributes (tokens, tool names/durations, permission decisions, cost); tool arguments and
# model text are only included with include_content = true.
otlp_endpoint = ""
# include_content = false
# [telemetry.attributes]
# deployment = "laptop"

[hooks]
# Hooks get the event as JSON and may answer with JSON:
#   {"decision":"block"|"allow","reason":"…","updatedInput":{…},"context":"…"}
# Entries are a command string or a table with exactly one executor — { command = … } (JSON on stdin,
# exit code 2 also blocks), { url = … } (POST the event, JSON response) or { prompt = … } (judged by the
# aux model) — plus matcher (glob or regex, "a|b" alternatives), timeout_secs, once, async.
# Events: pre_tool · post_tool · post_tool_failure · permission_request · permission_denied · on_stop ·
# on_prompt · session_start · session_end · subagent_stop · pre_compact · post_compact · before_model ·
# after_model · file_changed · worktree_create · notification. Hooks in .claude/settings.json are imported
# too (trusted directories only). See src/hooks.rs.
pre_tool = []          # e.g. [{ command = "./scripts/guard.sh", matcher = "bash" }]
post_tool = []         # e.g. [{ command = "cargo fmt", matcher = "write_file|edit_file|apply_patch" }]
on_stop = []
on_prompt = []
session_start = []
session_end = []
subagent_stop = []
pre_compact = []
notification = []

[security]
redact_secrets = true

[ui]
notify = true          # macOS notification when a long task finishes
theme = "dark"         # dark | light  (/theme toggles at runtime)
event_log = true       # ~/.config/harness/logs/<date>/tui-<pid>.jsonl

[sandbox]
# "none" | "seatbelt" (macOS sandbox-exec) | "bwrap" (Linux bubblewrap): shell may only write inside the
# workdir, temp dirs and ~/.config/harness (+allow_write). "docker" | "podman" runs every shell command
# inside `image` with the working directory mounted. deny_network = true blocks outbound connections.
mode = "none"
# image = "debian:stable-slim"
deny_network = false
allow_write = []

[self]
# Smart self-improvement loop (`harness improve`, `/improve` in the TUI).
# Who approves the proposed plan: "smart" = automatic with a frontier backend (provider claude-code/anthropic
# or a model matching smart_models), otherwise the user confirms; "always" | "never" force it.
auto = "smart"
smart_models = ["claude*", "*opus*", "*sonnet*", "*fable*", "gpt-5*", "o3*", "o4*"]
# Proposals per round, eval runs per side for the arbiter, seconds to cancel the automatic restart after install
max_items = 3
arbiter_runs = 1
restart_grace_secs = 60
# skip_arbiter = true      # gate merges on build + tests only (faster, less safe)
# repo = "/path/to/TheHarness"   # default: located from cwd / the binary / HARNESS_REPO
