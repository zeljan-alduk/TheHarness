# Harness configuration. Every key can be overridden with HARNESS_<UPPER_KEY> env vars.

[llm]
# Any OpenAI-compatible server: LM Studio (:1234), llama-server (:8080), Ollama (:11434/v1),
# OpenAI/OpenRouter/Gemini-compat (set api_key), or Anthropic: provider = "anthropic",
# base_url = "https://api.anthropic.com", model = "claude-sonnet-5", api_key from ANTHROPIC_API_KEY.
base_url = "http://localhost:1234/v1"
model = "qwen3.8-27b-mlx"
# provider = "openai"
# Use your Anthropic subscription through the official Claude Code CLI (must be installed & logged in);
# the harness bridges its own tools to it over MCP. In the TUI: /backend claude
# provider = "claude-code"
# model = "claude-fable-5"
# effort = "high"          # low | medium | high | max  (/effort in the TUI)
# Anthropic API with summarized thinking streamed back (Claude Code's headless mode hides thinking):
# provider = "anthropic"   model = "claude-fable-5"   thinking_budget = 8000
temperature = 0.2
# Reasoning models spend a lot of this budget on thinking; keep it generous.
max_tokens = 16384
# Auto-compaction threshold. By default the harness detects the model's loaded context length at
# start (LM Studio / llama.cpp / Ollama) and compacts at compact_at_fraction × that. Set
# context_budget_tokens to pin an explicit value instead.
compact_at_fraction = 0.75
# context_budget_tokens = 60000
# Optional smaller model for reflection/compaction (must be loaded on the same server):
# aux_model = "qwen/qwen3.6-35b-a3b"

[agent]
max_turns = 40
# Per tool call
tool_timeout_secs = 120
# Max characters of a tool result fed back to the model (head+tail kept)
max_tool_output_chars = 16000
# Optional wall-clock cap per task in the interactive UI (0 = unlimited); queued tasks continue afterwards
max_task_secs = 0

[eval]
tasks_dir = "evals/tasks"
# Where eval workdirs are created. Keep this OUTSIDE any Cargo workspace (default: $TMPDIR/harness-eval-runs).
# runs_dir = "/tmp/harness-eval-runs"
task_timeout_secs = 900

[net]
enabled = true
timeout_secs = 30
max_fetch_bytes = 2000000
# download_file: parallel range segments and per-call wall-clock cap (auto-resumes on the next call)
download_segments = 4
download_timeout_secs = 3600

[permissions]
# bypass | auto | ask | plan.  auto: reads free, writes inside the workdir free, risky shell commands
# and writes outside the workdir ask for approval. Rules: "<tool>" or "<tool>:<glob on primary arg>".
mode = "auto"
allow = ["bash:git status*", "bash:git diff*", "bash:git log*", "bash:cargo *", "bash:npm test*", "bash:pytest*"]
deny = ["bash:rm -rf /*", "bash:rm -rf ~*", "bash:*mkfs*", "bash:*dd if=*"]
ask = []

[hooks]
# Shell hooks (JSON on stdin). Entries are commands or { command, matcher, timeout_secs } where matcher is a
# glob / "a|b" on the tool name (tool events) or subject. pre_tool exit code 2 blocks the call. See src/hooks.rs.
pre_tool = []          # e.g. [{ command = "./scripts/guard.sh", matcher = "bash" }]
post_tool = []         # e.g. [{ command = "cargo fmt", matcher = "write_file|edit_file|apply_patch" }]
on_stop = []
on_prompt = []
session_start = []
session_end = []
subagent_stop = []
pre_compact = []
notification = []

[security]
redact_secrets = true

[ui]
notify = true          # macOS notification when a long task finishes
theme = "dark"         # dark | light  (/theme toggles at runtime)
event_log = true       # ~/.config/harness/logs/<date>/tui-<pid>.jsonl

[sandbox]
# "none" | "seatbelt" (macOS sandbox-exec: shell may only write inside the workdir, temp dirs and
# ~/.config/harness; deny_network = true also blocks outbound connections except localhost)
mode = "none"
deny_network = false
allow_write = []
